# H20 — Meta-Llama-3-8B-Instruct FP8_DYNAMIC（ModelScope / 可覆盖本地路径）
#
#   bash example/llm_compressor/h20/run_luban_h20_llama3_fp8_dynamic.sh
#   luban-sculpt compress --profile nvidia_h20 \
#     --recipe luban_sculpt/recipes/h20_llama3_8b_fp8_dynamic.yaml \
#     --output /data/out/h20-llama3-8b-fp8-dynamic
model_id: LLM-Research/Meta-Llama-3-8B-Instruct
model_arch: llama
quant:
  backend: llm_compressor
  abstract_scheme: fp8_dynamic
  deploy_target: vllm_cuda
  ignore:
    - lm_head
  llm_compressor:
    algorithm: quantization
    scheme: FP8_DYNAMIC
    trust_remote_code: true
    torch_dtype: float16
    device_map: "cuda:0"
    pipeline: sequential
    modifiers:
      - name: QuantizationPatch
        mode: patch
        ignore:
          - lm_head
    oneshot: {}
calib:
  source: stub
  max_samples: 128
  batch_size: 1
  distributed: false
  world_size: 1
