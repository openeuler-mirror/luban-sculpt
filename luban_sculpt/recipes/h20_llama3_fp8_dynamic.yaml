# H20 — 本地目录 Llama3 FP8_DYNAMIC：模型 ./llama3，校准 ./open-perfectblend
#
#   bash example/llm_compressor/h20/run_local_llama3_fp8.sh
#   luban-sculpt compress --profile nvidia_h20 \
#     --recipe luban_sculpt/recipes/h20_llama3_fp8_dynamic.yaml \
#     --output ./out-h20-llama3-fp8-dynamic

model_id: ./llama3
model_arch: llama
quant:
  backend: llm_compressor
  abstract_scheme: fp8_dynamic
  deploy_target: vllm_cuda
  ignore:
    - lm_head
  llm_compressor:
    algorithm: quantization
    scheme: FP8_DYNAMIC
    trust_remote_code: true
    # 整模放单卡，避免 auto offload 拖垮主机 RAM
    torch_dtype: float16
    device_map: "cuda:0"
    pipeline: sequential
    modifiers:
      - name: QuantizationPatch
        mode: patch
        ignore:
          - lm_head
    oneshot: {}
calib:
  source: open-perfectblend
  path: ./open-perfectblend
  max_samples: 128
  max_seq_length: 512
  max_chars: 2048
  batch_size: 1
  shuffle: true
  seed: 42
  distributed: false
  world_size: 1
