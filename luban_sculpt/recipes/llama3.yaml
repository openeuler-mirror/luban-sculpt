# Llama 3 — 三种精度（同一 recipe，改 --precision 即可）
#
# | 精度 | CLI | NVIDIA scheme | Ascend 映射 |
# |------|-----|---------------|-------------|
# | FP8 dynamic | --precision fp8_dynamic | fp8_dynamic | — |
# | FP8 block   | --precision fp8_block   | fp8_block   | — |
# | W4A16 GPTQ  | --precision w4a16       | w4a16       | — |
#
#   luban-sculpt compress --profile nvidia_h20 \
#     --recipe luban_sculpt/recipes/llama3.yaml \
#     --model-dir ./llama3 --output ./out-llama3-fp8-dynamic
#
#   luban-sculpt compress ... --precision fp8_block --output ./out-llama3-fp8-block
#   luban-sculpt compress ... --precision w4a16 --output ./out-llama3-w4a16
#
# 快配校准：追加 --calib-preset fast
# 两阶段 FP8→GPTQ：见 recipes/llama3_fp8_then_gptq.yaml

extends: quant

model:
  path: ./llama3
  arch: llama
  layout: hf_pretrained

calib:
  source: open-perfectblend
  path: ./open-perfectblend
  max_samples: 128
  max_seq_length: 512
  max_chars: 2048
  batch_size: 1
  shuffle: true
  seed: 42
  distributed: false
  world_size: 1
