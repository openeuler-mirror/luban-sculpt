# H20 — Llama3 FP8_DYNAMIC 快配（牺牲部分校准充分度，缩短 oneshot 时间）
#
# 相对 h20_llama3_fp8_dynamic.yaml：
#   - max_samples 128→32，max_seq_length 512→256
#   - batch_size 1→4（显存不够可改回 1/2）
#   - 关闭 sequential（整模常驻更快；OOM 时改回 llm_compressor.pipeline: sequential）
#
#   luban-sculpt compress --profile nvidia_h20 \
#     --recipe luban_sculpt/recipes/h20_llama3_fp8_dynamic_fast.yaml \
#     --output ./out-h20-llama3-fp8-dynamic-fast

model_id: ./llama3
model_arch: llama
pipeline:
  stages:
    - name: default
      backend: llm_compressor
      abstract_scheme: fp8_dynamic
      ignore:
        - lm_head
      llm_compressor:
        algorithm: quantization
        scheme: FP8_DYNAMIC
        trust_remote_code: true
        torch_dtype: float16
        device_map: "cuda:0"
        # 快配：不做逐层卸载；大模型 OOM 时改为 sequential
        pipeline: false
        modifiers:
          - name: QuantizationPatch
            mode: patch
            ignore:
              - lm_head
        oneshot: {}
calib:
  source: open-perfectblend
  path: ./open-perfectblend
  max_samples: 32
  max_seq_length: 256
  max_chars: 1024
  batch_size: 4
  shuffle: true
  seed: 42
  distributed: false
  world_size: 1
