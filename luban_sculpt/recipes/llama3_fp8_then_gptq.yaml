# Llama 3 两阶段：FP8 dynamic（llm_compressor）→ W4 GPTQ（gptq backend）
#
#   luban-sculpt compress --profile generic_cpu \
#     --recipe luban_sculpt/recipes/llama3_fp8_then_gptq.yaml \
#     --model-id meta-llama/Llama-3.1-8B-Instruct --output ./out-two-stage
#
# 等价 CLI：llama3.yaml + --pipeline-preset fp8_then_gptq

extends: quant

model:
  path: meta-llama/Llama-3.1-8B-Instruct
  arch: llama
  layout: hub_id

calib:
  source: stub
  max_samples: 64

pipeline:
  stages:
    - name: fp8_prep
      backend: auto
      precision: fp8_dynamic
      ignore:
        - lm_head
      output_subdir: stage1_fp8
    - name: gptq_w4
      backend: gptq
      algorithm: gptq
      abstract_scheme: w4_gptq
      input_from: previous
      output_subdir: stage2_gptq
      backend_options:
        bits: 4
        group_size: 128
